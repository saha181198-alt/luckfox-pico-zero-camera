# Luckfox Pico Zero camera -> ST7735 settings.
# Keep "auto" values for the first boot. The script tries common UVC modes.

VIDEO_DEVICE=auto
INPUT_FORMAT=auto
VIDEO_SIZE=auto
FRAMERATE=auto

FB_DEVICE=/dev/fb0
DISPLAY_FPS=25

# fill: keep proportions and crop the edges (recommended)
# fit: keep proportions and add black bars
# stretch: force the whole source into 160x128
FIT_MODE=fill

# quiet, panic, fatal, error, warning, info, verbose, debug, trace
FFMPEG_LOG_LEVEL=warning

